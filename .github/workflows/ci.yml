name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  test-and-package:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Run tests
        run: make test

      - name: Build GitHub release installer
        env:
          RELEASE_REPOSITORY: ${{ github.repository }}
        run: make package VERSION=ci

      - name: Verify generated commands did not modify tracked sources
        run: git diff --exit-code

      - name: Upload GitHub release installer artifacts
        uses: actions/upload-artifact@v4
        with:
          name: account-assessment-cloudformation-installer
          path: deployment/release/*
          if-no-files-found: error
