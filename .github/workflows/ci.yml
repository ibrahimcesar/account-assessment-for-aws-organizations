name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  test-and-synth:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Run tests
        run: make test

      - name: Build deployable cloud assembly
        run: make synth

      - name: Verify generated commands did not modify tracked sources
        run: git diff --exit-code

      - name: Upload cloud assembly
        uses: actions/upload-artifact@v4
        with:
          name: account-assessment-cloud-assembly
          path: |
            deployment/cdk.out/
            deployment/regional-s3-assets/
          if-no-files-found: error
