name: Publish deployment artifacts

on:
  release:
    types:
      - published

permissions:
  contents: write

jobs:
  package:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Build CloudFormation installer and payload
        env:
          RELEASE_REPOSITORY: ${{ github.repository }}
        run: make package VERSION="${{ github.event.release.tag_name }}"

      - name: Attach deployment artifacts to GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: >
          gh release upload
          "${{ github.event.release.tag_name }}"
          deployment/release/*
          --clobber
